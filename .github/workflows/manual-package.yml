name: Manual Package

# 手动按需打包：选择 deb / rpm / appimage，点击运行即可
# 产物在本次 run 的 Artifacts 区下载

on:
  workflow_dispatch:
    inputs:
      package:
        description: '要打包的格式'
        type: choice
        required: true
        default: deb
        options:
          - deb
          - rpm
          - appimage   # Arch 用户使用此格式

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend/src-tauri -> target

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build package
        run: |
          cd frontend
          npx tauri build --bundles ${{ github.event.inputs.package }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noteforge-${{ github.event.inputs.package }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
