name: Release

# 推送 v* 标签时自动打包三平台安装包并发布到 GitHub Release
# 也可在 Actions 页面手动触发（跳过 Release，仅上传 artifacts）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest   # .exe (NSIS) + .msi
          - platform: macos-latest     # .app + .dmg (Apple Silicon)
          - platform: ubuntu-22.04     # .AppImage + .deb + .rpm

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend/src-tauri -> target

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 触发时发布到 Release；手动触发时仅上传 artifacts
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('NoteForge {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
          includeDebug: false
          includeRelease: true
