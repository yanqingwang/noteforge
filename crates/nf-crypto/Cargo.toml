[package]
name = "nf-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = "0.5"
base64 = "0.22"
pbkdf2 = "0.12"
hmac = "0.12"
rand = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
generic-array = { version = "0.14", features = ["more_lengths"] }

[dev-dependencies]
tempfile = "3"
